name: Prepare patched triagebot
description: Build the pinned upstream action with the tsrs overlay, or restore its compiled bundle
inputs:
  save-cache:
    description: Only trusted main pushes populate this cache
    default: 'false'
runs:
  using: composite
  steps:
    - name: Restore compiled action
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/triagebot-action/dist
        key: triage-action-v1-${{ runner.os }}-${{ runner.arch }}-51d30da1-${{ hashFiles('.github/triagebot/**') }}

    - name: Check out pinned action source
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: withastro/triagebot-action
        ref: 51d30da13c0bd571a3822fc56882de40fead0086
        path: target/triagebot-action
        persist-credentials: false

    - name: Set up the action's pinned pnpm
      if: steps.cache.outputs.cache-hit != 'true'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11.5.0
        package_json_file: target/triagebot-action/package.json

    - name: Apply tsrs action changes
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: node .github/triagebot/apply.mjs

    - name: Build patched action
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: target/triagebot-action
      run: |
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm exec tsc --noEmit
        node --test test/*.test.ts
        pnpm build
        node --check dist/index.mjs

    - name: Save compiled action from main
      if: inputs.save-cache == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/triagebot-action/dist
        key: ${{ steps.cache.outputs.cache-primary-key }}
