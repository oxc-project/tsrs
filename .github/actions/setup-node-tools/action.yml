name: Set up Node and pnpm
description: Install the pinned tools without installing workspace dependencies

inputs:
  package-json-file:
    description: Manifest containing the pnpm packageManager pin
    default: package.json

runs:
  using: composite
  steps:
    # pnpm's bootstrap needs the pinned Node even on runners shipping an older version.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: ${{ inputs.package-json-file }}
        run_install: false

    - name: Verify tools
      shell: bash
      env:
        PACKAGE_JSON_FILE: ${{ inputs.package-json-file }}
      run: |
        cd "$(dirname "$PACKAGE_JSON_FILE")"
        node --version
        pnpm --version
