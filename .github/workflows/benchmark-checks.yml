name: Benchmark tooling

on:
  pull_request:
    paths: ['bench/**', '.github/workflows/benchmark-checks.yml']
  push:
    branches: [main]
    paths: ['bench/**', '.github/workflows/benchmark-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bench/requirements-charts.txt
      - run: python -m pip install -r bench/requirements-charts.txt
      - name: Check benchmark execution and reporting offline
        run: python -m unittest discover -s bench -p 'test_*.py'
