name: CI

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Source checks
        id: source-checks
        run: python3 tools/lint/source.py --self-test && python3 tools/lint/source.py
        background: true

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-lint

      - name: Clippy
        run: cargo clippy --locked --all-targets --config 'build.warnings="deny"'

      - wait: source-checks

  test:
    name: Test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSRS_TEST: target/debug/tsrs-test
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # Actions share GITHUB_EVENT_PATH, which the runner rewrites when a step starts.
      # Keep action steps sequential so readers cannot observe a truncated event payload.
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-test

      - name: Read TypeScript reference commit
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      # The conformance suite and workspace tests need the pinned upstream fixtures.
      - name: Check out TypeScript test fixtures and clients
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: |
            tsc/testdata
            packages/typescript/src
            packages/typescript/lib
            packages/typescript/vendor
            tools/scripts/tsc
          persist-credentials: false

      - name: cargo check
        run: cargo check --locked --config 'build.warnings="deny"'

      - name: cargo test (workspace)
        run: cargo test --locked

      - name: npm library paths (noembed)
        run: cargo test --locked -p tsrs_cli --features noembed --test npm_lib_path

      - name: Build correctness binaries
        run: cargo build --profile dev --locked -p tsrs_cli -p tsrs_testrunner

      - name: Conformance suite
        run: .github/scripts/conformance-gate.sh

      - name: Conformance suite (default checker mode)
        env:
          TS_TEST_PROGRAM_SINGLE_THREADED: "false"
          TSRS_HISTORY: canonical
          MIN_TYPES: "12778"
          MIN_SYMBOLS: "12778"
          TSRS_TEST_RESULTS: ${{ github.workspace }}/target/test-results-default
        run: .github/scripts/conformance-gate.sh

      - name: Regression cases
        run: tools/regressions.sh target/debug/tsrs

      - name: Upload conformance results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-results
          path: |
            target/test-results/*.txt
            target/test-results-default/*.txt
          if-no-files-found: ignore

  node-api-clients:
    name: Node API upstream clients
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - name: Read TypeScript reference commit
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned TypeScript client and Go oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ts-ref/node_modules
            ts-ref/packages/typescript/node_modules
            ts-ref/pnpm-lock.yaml
            ts-ref/pnpm-workspace.yaml
          key: node-api-harness-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ steps.ts.outputs.commit }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-node-api-clients

      - name: Set up pinned upstream client and Go oracle
        run: tools/node-api/setup.sh

      - name: Go oracle sync and async client suites
        run: node tools/node-api/run-upstream.mjs --binary tools/node-api/.work/oracle/tsc --label go-oracle --suite upstream --no-trace

      - name: Build tsrs API server
        run: cargo build --profile dev --locked -p tsrs_cli

      - name: tsrs sync and async client suites
        run: node tools/node-api/run-upstream.mjs --binary target/debug/tsrs --label tsrs --suite upstream --no-trace

      - name: Upload Node API client results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-api-clients
          include-hidden-files: true
          path: |
            tools/node-api/.work/go-oracle/summary.json
            tools/node-api/.work/go-oracle/results.jsonl
            tools/node-api/.work/go-oracle/run.tap
            tools/node-api/.work/tsrs/summary.json
            tools/node-api/.work/tsrs/results.jsonl
            tools/node-api/.work/tsrs/run.tap
          if-no-files-found: ignore

  fourslash:
    name: Fourslash
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Match the runner's cache directory so setup-go restores and saves its build cache.
      GOCACHE: ${{ github.workspace }}/target/go-fourslash/go-cache
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # As above, setup and checkout actions must not race on GITHUB_EVENT_PATH.
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-fourslash

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.15'

      - name: Read TypeScript reference commit
        id: ts
        run: |
          python3 -c 'import tomllib; print("commit=" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["metadata"]["typescript"]["commit"])' >> "$GITHUB_OUTPUT"

      - name: Check out TypeScript source and testdata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc
          persist-credentials: false

      - name: Fourslash server framing checks
        run: cargo test --locked -p tsrs_fourslash_server

      - name: Build Go Fourslash server
        run: cargo build --profile dev --locked -p tsrs_fourslash_server

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum

      - name: Go Fourslash gate checks
        run: python3 -m unittest discover -s tools/go-fourslash -p 'test_*.py'

      - name: Go Fourslash suite
        run: .github/scripts/go-fourslash-gate.sh

      - name: Upload Go Fourslash results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-fourslash-results
          path: |
            target/go-fourslash/results.jsonl
            target/go-fourslash/runner.log
            target/go-fourslash/reference/tsc/testdata/baselines/local/fourslash/
          if-no-files-found: ignore

  determinism:
    name: Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          # Public benchmark installs use Yarn 1, which rejects an unset NODE_AUTH_TOKEN in .npmrc.
          registry-url: ""

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-determinism

      - name: Build checker
        run: cargo build --profile dev --locked -p tsrs_cli

      - name: Check out the PR or merge queue base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: base-src
          persist-credentials: false

      - name: Build base checker for ordered diagnostics
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: base-src
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tsrs-base-target
        run: cargo build --profile dev --locked -p tsrs_cli

      - name: Determinism cache keys
        id: determinism-keys
        run: python3 bench/run.py --print-cache-keys --projects xstate-main,webpack,nuxt,drizzle-orm | tee -a "$GITHUB_OUTPUT"

      - name: Restore benchmark compilers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.determinism-keys.outputs.shared }}

      - name: Restore xstate-main
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench/.work/solutions/xstate-main
          key: bench-xstate-main-${{ runner.os }}-${{ steps.determinism-keys.outputs['xstate-main'] }}

      - name: Restore webpack
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench/.work/solutions/webpack
          key: bench-webpack-${{ runner.os }}-${{ steps.determinism-keys.outputs['webpack'] }}

      - name: Restore nuxt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench/.work/solutions/nuxt
          key: bench-nuxt-${{ runner.os }}-${{ steps.determinism-keys.outputs.nuxt }}

      - name: Restore drizzle-orm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench/.work/solutions/drizzle-orm
          key: bench-drizzle-orm-${{ runner.os }}-${{ steps.determinism-keys.outputs['drizzle-orm'] }}

      - name: Set up determinism projects
        run: python3 bench/run.py --setup-only --projects xstate-main,webpack,nuxt,drizzle-orm

      # The four pinned projects and every regression case must be deterministic across checker schedules.
      # On PRs and merge groups, their ordered diagnostics and exit codes must also match the base binary.
      - name: Determinism and ordered diagnostics
        run: |
          python3 tools/ci/compare_diagnostics.py --self-test
          tools/ci/determinism.sh --self-test
          if [[ "$GITHUB_EVENT_NAME" = pull_request || "$GITHUB_EVENT_NAME" = merge_group ]]; then
            tools/ci/determinism.sh target/debug/tsrs --base "$RUNNER_TEMP/tsrs-base-target/debug/tsrs"
          else
            tools/ci/determinism.sh target/debug/tsrs
          fi
