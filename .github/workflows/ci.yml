name: CI

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: ./.github/actions/setup-node-tools

      - name: Source checks
        id: source-checks
        run: node tools/lint/source.mjs --self-test && node tools/lint/source.mjs && node tools/check-scripts.mjs
        background: true

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-lint

      - name: Clippy
        run: cargo clippy --locked --all-targets --config 'build.warnings="deny"'

      - wait: source-checks

  api-transport-windows:
    name: API transport Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: api-transport-windows
      - name: Check checker layout
        run: cargo check --locked -p tsrs_checker --config 'build.warnings="deny"'
      - run: cargo test --locked -p tsrs_api_transport --lib --config 'build.warnings="deny"'

  build-correctness:
    name: Build correctness binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-correctness-ci

      - name: Build correctness binaries
        run: cargo build --profile ci --locked -p tsrs_cli -p tsrs_testrunner -p tsrs_determinism

      - name: Upload correctness binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: correctness-binaries
          path: |
            target/ci/tsrs
            target/ci/tsrs-test
            target/ci/tsrs_determinism
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test Linux
    needs: build-correctness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSRS_TEST: target/ci/tsrs-test
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # Actions share GITHUB_EVENT_PATH, which the runner rewrites when a step starts.
      # Keep action steps sequential so readers cannot observe a truncated event payload.
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-test-ci

      - name: Read TypeScript reference commit
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      # The conformance suite and workspace tests need the pinned upstream fixtures.
      - name: Check out TypeScript test fixtures and clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: |
            tsc/testdata
            packages/typescript/src
            packages/typescript/lib
            packages/typescript/vendor
            tools/scripts/tsc
          persist-credentials: false

      - name: cargo check
        run: cargo check --profile ci --locked --config 'build.warnings="deny"'

      - name: cargo test (workspace)
        run: cargo test --profile ci --locked

      # Restore after workspace tests, which may build a different CLI dependency feature set.
      # Conformance, regressions and determinism must exercise the same compiled CLI.
      - name: Download correctness binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: correctness-binaries
          path: target/ci

      - name: Make correctness binaries executable
        run: chmod +x target/ci/tsrs target/ci/tsrs-test

      - name: Conformance suite (all baselines)
        run: .github/scripts/conformance-gate.sh

      - name: Conformance suite (all baselines, default checker mode)
        env:
          TS_TEST_PROGRAM_SINGLE_THREADED: "false"
          TSRS_HISTORY: canonical
          TSRS_TEST_RESULTS: ${{ github.workspace }}/target/test-results-default
        run: .github/scripts/conformance-gate.sh

      - name: Regression cases
        run: tools/regressions.sh target/ci/tsrs

      # Finish using the embedded CLI before switching its dependency features.
      - name: npm library paths (noembed)
        run: cargo test --profile ci --locked -p tsrs_cli --features noembed --test npm_lib_path

      - name: Upload conformance results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            target/test-results/*.txt
            target/test-results/summary.json
            target/test-results-default/*.txt
            target/test-results-default/summary.json
          if-no-files-found: ignore

  node-api-clients:
    name: Node API clients and parity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - name: Read TypeScript reference commit
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned TypeScript client and Go oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          persist-credentials: false

      - id: harness-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ts-ref/node_modules
            ts-ref/packages/typescript/node_modules
            ts-ref/pnpm-lock.yaml
            ts-ref/pnpm-workspace.yaml
          key: node-api-harness-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ steps.ts.outputs.commit }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-node-api-clients

      - name: Set up pinned upstream client and Go oracle
        run: tools/node-api/setup.sh

      - name: Check vendored SDK against upstream
        run: node npm/sdk/sync-upstream.mjs --check

      - name: Check generated compiler sources
        run: tools/gen-check.sh

      - name: Go oracle client and parity suites
        run: node tools/node-api/run-upstream.mjs --binary tools/node-api/.work/oracle/tsc --label go-oracle --suite all --no-trace

      - name: Build tsrs API server
        run: cargo build --profile dev --locked -p tsrs_cli

      - name: tsrs client and parity suites
        run: node tools/node-api/run-upstream.mjs --binary target/debug/tsrs --label tsrs --suite all --no-trace

      - name: Upload Node API client results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-api-clients
          include-hidden-files: true
          path: |
            tools/node-api/.work/go-oracle/summary.json
            tools/node-api/.work/go-oracle/results.jsonl
            tools/node-api/.work/go-oracle/run.tap
            tools/node-api/.work/tsrs/summary.json
            tools/node-api/.work/tsrs/results.jsonl
            tools/node-api/.work/tsrs/run.tap
          if-no-files-found: ignore

      - name: Save Node API harness on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.harness-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ts-ref/node_modules
            ts-ref/packages/typescript/node_modules
            ts-ref/pnpm-lock.yaml
            ts-ref/pnpm-workspace.yaml
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}

  fourslash:
    name: Fourslash
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Match the runner's cache directory so setup-go restores and saves its build cache.
      GOCACHE: ${{ github.workspace }}/target/go-fourslash/go-cache
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # As above, setup and checkout actions must not race on GITHUB_EVENT_PATH.
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-fourslash

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - name: Read TypeScript reference commit
        id: ts
        run: |
          echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out TypeScript source and testdata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc
          persist-credentials: false

      - name: Fourslash server framing checks
        run: cargo test --locked -p tsrs_fourslash_server

      - name: Build Go Fourslash server
        run: cargo build --profile dev --locked -p tsrs_fourslash_server

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum

      - name: Go Fourslash gate checks
        run: node --test tools/go-fourslash/test_*.mjs

      - name: Go Fourslash suite
        run: .github/scripts/go-fourslash-gate.sh

      - name: Upload Go Fourslash results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-fourslash-results
          path: |
            target/go-fourslash/results.jsonl
            target/go-fourslash/runner.log
            target/go-fourslash/reference/tsc/testdata/baselines/local/fourslash/
          if-no-files-found: ignore

  determinism:
    name: Determinism
    needs: build-correctness
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: ./.github/actions/setup-node-tools

      - name: Install root tooling and pinned TypeScript
        run: pnpm --filter tsrs-tooling install --frozen-lockfile

      - name: Download correctness binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: correctness-binaries
          path: target/ci

      - name: Make task and compiler executable
        run: chmod +x target/ci/tsrs target/ci/tsrs_determinism

      - name: Benchmark cache key
        id: keys
        run: echo "work=$(node bench/bench.mjs plan --format keys --projects all | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore benchmark projects
        id: projects-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bench/.work/suite
            bench/.work/solutions
          key: determinism-work-${{ runner.os }}-${{ runner.arch }}-all-${{ steps.keys.outputs.work }}

      - name: Check committed tsgo snapshots
        id: snapshots
        run: target/ci/tsrs_determinism check --projects all --tsrs target/ci/tsrs

      - name: Check regression scheduling
        if: success() || steps.snapshots.outcome == 'failure'
        run: target/ci/tsrs_determinism regressions --tsrs target/ci/tsrs

      - name: Upload determinism results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism
          path: target/determinism/
          if-no-files-found: warn
          retention-days: 14

      - name: Save benchmark projects on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.projects-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bench/.work/suite
            bench/.work/solutions
          key: ${{ steps.projects-cache.outputs.cache-primary-key }}
