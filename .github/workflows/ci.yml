name: CI
on:
  workflow_dispatch:
permissions: {}
jobs:
  diagnose:
    name: Executable copy race diagnosis
    runs-on: namespace-profile-linux-x64-default
    timeout-minutes: 10
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          path: /home/runner/.rustup
          cache: rust
      - name: Reproduce executable descriptor race
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          console.log(execFileSync("uname", ["-a"], {encoding:"utf8"}));
          fs.writeFileSync("target/ci-exec-race.rs", "use std::fs::{self, OpenOptions};\nuse std::io::{self, Read, Write};\nuse std::os::fd::AsRawFd;\nuse std::os::unix::fs::MetadataExt;\nuse std::os::unix::process::CommandExt;\nuse std::path::Path;\nuse std::process::Command;\nuse std::sync::atomic::{AtomicBool, Ordering};\nuse std::thread;\n\nunsafe extern \"C\" {\n    fn getpid() -> i32;\n    fn read(fd: i32, buffer: *mut u8, len: usize) -> isize;\n    fn write(fd: i32, buffer: *const u8, len: usize) -> isize;\n}\n\nfn stress(source: &Path, root: &Path, link: bool) -> usize {\n    let running = AtomicBool::new(true);\n    let mut busy = 0;\n    thread::scope(|scope| {\n        for _ in 0..4 {\n            scope.spawn(|| {\n                while running.load(Ordering::Relaxed) {\n                    assert!(Command::new(\"/bin/true\").status().unwrap().success());\n                }\n            });\n        }\n        for index in 0..1000 {\n            let exe = root.join(format!(\"stress-{index}\"));\n            if link { fs::hard_link(source, &exe).unwrap(); }\n            else { fs::copy(source, &exe).unwrap(); }\n            match Command::new(&exe).status() {\n                Ok(status) => assert!(status.success()),\n                Err(err) if err.kind() == io::ErrorKind::ExecutableFileBusy => busy += 1,\n                Err(err) => panic!(\"{err}\"),\n            }\n            fs::remove_file(exe).unwrap();\n        }\n        running.store(false, Ordering::Relaxed);\n    });\n    busy\n}\n\nfn main() {\n    let pid = std::process::id();\n    let target = std::env::current_dir().unwrap().join(\"target/ci\");\n    fs::create_dir_all(&target).unwrap();\n    let source = target.join(format!(\"exec-race-source-{pid}\"));\n    fs::copy(\"/bin/true\", &source).unwrap();\n    let temp = std::env::temp_dir().join(format!(\"tsrs-exec-race-{pid}\"));\n    let sibling = target.join(format!(\"exec-race-sibling-{pid}\"));\n    fs::create_dir_all(&temp).unwrap();\n    fs::create_dir_all(&sibling).unwrap();\n    println!(\"source device: {}, temp device: {}\", fs::metadata(&source).unwrap().dev(), fs::metadata(&temp).unwrap().dev());\n    println!(\"target -> temp hard link: {:?}\", fs::hard_link(&source, temp.join(\"linked\")));\n    let linked = sibling.join(\"linked\");\n    fs::hard_link(&source, &linked).unwrap();\n    println!(\"target -> sibling hard link: same inode = {}\", fs::metadata(&source).unwrap().ino() == fs::metadata(&linked).unwrap().ino());\n\n    let copied = temp.join(\"copied\");\n    fs::copy(&source, &copied).unwrap();\n    let writable = OpenOptions::new().write(true).open(&copied).unwrap();\n    let (mut ready_reader, ready_writer) = io::pipe().unwrap();\n    let (release_reader, mut release_writer) = io::pipe().unwrap();\n    let holder = thread::spawn(move || {\n        let mut command = Command::new(\"/bin/true\");\n        // SAFETY: the pre-exec callback only uses async-signal-safe libc calls.\n        unsafe {\n            command.pre_exec(move || {\n                let bytes = getpid().to_ne_bytes();\n                assert_eq!(write(ready_writer.as_raw_fd(), bytes.as_ptr(), bytes.len()), 4);\n                let mut byte = 0;\n                assert_eq!(read(release_reader.as_raw_fd(), &raw mut byte, 1), 1);\n                Ok(())\n            });\n        }\n        assert!(command.status().unwrap().success());\n    });\n    let mut bytes = [0; 4];\n    ready_reader.read_exact(&mut bytes).unwrap();\n    let holder_pid = i32::from_ne_bytes(bytes);\n    drop(writable);\n    for entry in fs::read_dir(format!(\"/proc/{holder_pid}/fd\")).unwrap() {\n        let entry = entry.unwrap();\n        if fs::read_link(entry.path()).ok().as_deref() == Some(copied.as_path()) {\n            let fd = entry.file_name();\n            println!(\"inherited descriptor {} -> {}\", entry.path().display(), copied.display());\n            println!(\"{}\", fs::read_to_string(format!(\"/proc/{holder_pid}/fdinfo/{}\", fd.to_string_lossy())).unwrap());\n        }\n    }\n    let blocked = Command::new(&copied).status();\n    println!(\"execute copied file after parent closed writer: {blocked:?}\");\n    println!(\"execute hard-linked file while child holds copied-file writer: {:?}\", Command::new(&linked).status());\n    release_writer.write_all(b\"x\").unwrap();\n    holder.join().unwrap();\n    assert!(Command::new(&copied).status().unwrap().success());\n    assert_eq!(blocked.unwrap_err().kind(), io::ErrorKind::ExecutableFileBusy);\n    println!(\"execute copied file after child exec closed inherited writer: success\");\n    println!(\"ordinary concurrent-spawn stress, copied files: {} ETXTBSY / 1000\", stress(&source, &temp, false));\n    println!(\"ordinary concurrent-spawn stress, hard-linked files: {} ETXTBSY / 1000\", stress(&source, &sibling, true));\n    fs::remove_dir_all(temp).unwrap();\n    fs::remove_dir_all(sibling).unwrap();\n    fs::remove_file(source).unwrap();\n}");
          execFileSync("rustc", ["--edition=2024", "target/ci-exec-race.rs", "-o", "target/ci-exec-race"], {stdio:"inherit"});
          execFileSync("target/ci-exec-race", [], {stdio:"inherit"});
          JS
