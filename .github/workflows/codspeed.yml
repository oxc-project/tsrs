# CodSpeed (https://codspeed.io): single-threaded, in-memory CPU simulation plus one-shot, disk-backed
# default-parallelism compilations for memory and walltime. Each project runs in its own process so arenas from
# earlier compilations cannot inflate peak memory (walltime samples ten such processes). Walltime uses a Graviton Macro
# Runner, with an arm64 build made on Ubuntu 22.04 to match its glibc. The broader Hyperfine comparison is in wallclock.yml.
# Security: read-only GITHUB_TOKEN plus an OIDC token for the CodSpeed upload, no secrets.

name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # CodSpeed dispatches this to backfill main.
  workflow_dispatch:

# Pushes to main each run to completion; a newer commit on the same pull request cancels the older run.
concurrency:
  group: codspeed-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build benchmarks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, memory]
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: codspeed-${{ matrix.mode }}
          tools: cargo-codspeed@5.0.3

      # The release profile without the PGO training of the npm binaries, whose profile changes with every build and
      # would move the counts. Symbols kept for CodSpeed's flame graphs.
      - name: Build benchmarks
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = simulation ]; then
            bench=compiler
          else
            bench=compiler_default
          fi
          cargo codspeed build -p tsrs_bench --bench "$bench" --features codspeed --profile release --locked -m "$MODE"

      # Archive the binaries to preserve executable permissions across artifact upload/download.
      - name: Package benchmarks
        run: tar -czf codspeed-benchmarks.tar.gz -C target codspeed

      - name: Upload benchmarks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codspeed-${{ matrix.mode }}
          path: codspeed-benchmarks.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-walltime:
    name: Build benchmarks (walltime arm64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: codspeed-walltime-arm64
          tools: cargo-codspeed@5.0.3

      - name: Build benchmarks
        # mimalloc v3 enables ARMv8.1 LSE atomics by default on arm64. The Graviton Macro Runner cannot execute
        # them (SIGILL in _mi_atomic_once_enter), so use portable allocator code for this artifact only.
        run: cargo codspeed build -p tsrs_bench --bench compiler_default --features codspeed,mimalloc-safe/no_opt_arch --profile release --locked -m walltime

      - name: Package benchmarks
        run: tar -czf codspeed-benchmarks.tar.gz -C target codspeed

      - name: Upload benchmarks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codspeed-walltime
          path: codspeed-benchmarks.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  benchmarks:
    name: Benchmark (${{ matrix.mode }}, ${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, memory]
        project: [Compiler-Unions, xstate-main, webpack, drizzle-orm]
    env:
      TSRS_BENCH_PROJECT: ${{ matrix.project }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: "" # Public benchmark installs use Yarn 1, which rejects an unset NODE_AUTH_TOKEN.

      - name: Cache key for the bench project
        id: keys
        run: echo "work=$(node bench/bench.mjs plan --format keys --projects "$TSRS_BENCH_PROJECT" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the bench project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
            bench/.work/solutions/${{ matrix.project }}
          key: codspeed-work-${{ runner.os }}-${{ runner.arch }}-${{ matrix.project }}-${{ steps.keys.outputs.work }}

      - name: Set up the bench project
        run: node bench/bench.mjs prepare --projects "$TSRS_BENCH_PROJECT"

      - name: Set up Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          restore-cache: false
          tools: cargo-codspeed@5.0.3

      - name: Download benchmarks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codspeed-${{ matrix.mode }}

      - name: Unpack benchmarks
        run: |
          mkdir -p target
          tar -xzf codspeed-benchmarks.tar.gz -C target

      - name: Run simulation
        if: matrix.mode == 'simulation'
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        env:
          MIMALLOC_ARENA_PURGE_MULT: "-1"
          RAYON_NUM_THREADS: "1"
        with:
          mode: simulation
          run: cargo codspeed run -p tsrs_bench --bench compiler -m simulation

      - name: Run memory
        if: matrix.mode == 'memory'
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: memory
          run: cargo codspeed run -p tsrs_bench --bench compiler_default -m memory

  walltime:
    name: Benchmark (walltime, ${{ matrix.project }})
    needs: build-walltime
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        project: [Compiler-Unions, xstate-main, webpack, drizzle-orm]
    env:
      TSRS_BENCH_PROJECT: ${{ matrix.project }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # The Macro Runner's preinstalled Node 18 cannot install the repository's pnpm 12 pin.
      # Set up Node before installing pnpm; setup-node's composite action installs pnpm first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@12.10.1

      - name: Cache key for the bench project
        id: keys
        run: echo "work=$(python3 bench/run.py --print-cache-keys --projects "$TSRS_BENCH_PROJECT" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the bench project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
            bench/.work/solutions/${{ matrix.project }}
          key: codspeed-work-${{ runner.os }}-${{ runner.arch }}-${{ matrix.project }}-${{ steps.keys.outputs.work }}

      - name: Set up the bench project
        run: python3 bench/run.py --setup-only --projects "$TSRS_BENCH_PROJECT"

      - name: Set up Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          restore-cache: false
          tools: cargo-codspeed@5.0.3

      - name: Download benchmarks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codspeed-walltime

      - name: Unpack benchmarks
        run: |
          mkdir -p target
          tar -xzf codspeed-benchmarks.tar.gz -C target

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: walltime
          run: cargo codspeed run -p tsrs_bench --bench compiler_default -m walltime
