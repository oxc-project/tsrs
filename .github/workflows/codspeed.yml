# CodSpeed (https://codspeed.io): full compilations against an in-memory filesystem, single-threaded under CPU
# simulation. tsrs_bench captures the project's filesystem before measurement, then Criterion2 measures a fresh
# compilation. Build the suite once, then run each project in a separate job to parallelize simulation and isolate
# compiler arenas and settings.
# Wall-time reports are published by .github/workflows/update-benchmarks.yml.
# Security: read-only GITHUB_TOKEN plus an OIDC token for the CodSpeed upload, no secrets.

name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # CodSpeed dispatches this to backfill main.
  workflow_dispatch:

# Pushes to main each run to completion; a newer commit on the same pull request cancels the older run.
concurrency:
  group: codspeed-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: codspeed
          tools: cargo-codspeed@5.0.3

      # The release profile without the PGO training of the npm binaries, whose profile changes with every build and
      # would move the counts. Symbols kept for CodSpeed's flame graphs.
      - name: Build benchmarks
        run: cargo codspeed build -p tsrs_bench --bench compiler --features codspeed --profile release --locked -m simulation

      # Archive the binaries to preserve executable permissions across artifact upload/download.
      - name: Package benchmarks
        run: tar -czf codspeed-benchmarks.tar.gz -C target codspeed

      - name: Upload benchmarks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-benchmarks
          path: codspeed-benchmarks.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  benchmarks:
    name: Benchmark (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        project: [Compiler-Unions, xstate-main, webpack, drizzle-orm]
    env:
      TSRS_BENCH_PROJECT: ${{ matrix.project }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: "" # Public benchmark installs use Yarn 1, which rejects an unset NODE_AUTH_TOKEN.

      - name: Cache key for the bench project
        id: keys
        run: echo "work=$(python3 bench/run.py --print-cache-keys --projects "$TSRS_BENCH_PROJECT" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the bench project
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
            bench/.work/solutions/${{ matrix.project }}
          key: codspeed-work-${{ runner.os }}-${{ matrix.project }}-${{ steps.keys.outputs.work }}

      - name: Set up the bench project
        run: python3 bench/run.py --setup-only --projects "$TSRS_BENCH_PROJECT"

      - name: Set up Rust
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          restore-cache: false
          tools: cargo-codspeed@5.0.3

      - name: Download benchmarks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codspeed-benchmarks

      - name: Unpack benchmarks
        run: |
          mkdir -p target
          tar -xzf codspeed-benchmarks.tar.gz -C target

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        env:
          MIMALLOC_ARENA_PURGE_MULT: "-1"
          RAYON_NUM_THREADS: "1"
        with:
          mode: simulation
          run: cargo codspeed run -p tsrs_bench --bench compiler -m simulation
