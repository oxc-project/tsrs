name: Windows ARM64 PGO profile diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: Windows ARM64 shared and per-process profiles
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      TSRS_TS_VERSION: 7.1.0-beta
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/TypeScript
          ref: 3e9236361fa97a9e6c685f4833ac457ae2d8c50a
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc/testdata
          persist-credentials: false
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c
        with:
          registry-url: ""
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12
        with:
          restore-cache: false
          components: llvm-tools
      - name: Build instrumented binaries
        shell: pwsh
        run: |
          rustc -vV
          $hostTriple = (rustc -vV | Select-String '^host: ').ToString().Substring(6)
          $rustBin = Join-Path (rustc --print sysroot) "lib/rustlib/$hostTriple/bin"
          $env:CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER = Join-Path $rustBin "rust-lld.exe"
          if (-not (Test-Path $env:CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER)) { throw "missing rust-lld" }
          $raw = Join-Path $env:RUNNER_TEMP "pgo/raw"
          New-Item -ItemType Directory -Force $raw | Out-Null
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "pgo/target"
          $env:CARGO_ENCODED_RUSTFLAGS = @("-Cprofile-generate=$raw", "-Clto=thin") -join [char]31
          cargo build --release --locked -p tsrs_cli -p tsrs_testrunner --bins --features tsrs_cli/noembed --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PROFDATA=$(Join-Path $rustBin 'llvm-profdata.exe')" >> $env:GITHUB_ENV
      - name: Compare profile patterns with full training
        shell: pwsh
        run: node .github/scripts/windows-pgo-probe.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-pgo-profile-patterns
          path: |
            ${{ runner.temp }}/pgo/probe-report.json
            ${{ runner.temp }}/pgo/probe-logs/
            ${{ runner.temp }}/pgo/training/
          retention-days: 7
          if-no-files-found: warn
