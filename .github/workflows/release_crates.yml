name: Release Crates

permissions: {}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and package the crates without publishing"
        type: boolean
        default: true

# Keep partial publishes resumable; cargo-release-oxc skips versions already on crates.io.
concurrency:
  group: release-crates
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'oxc-project/tsrs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: ""

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          cache-key: crates

      - name: Verify packaged crates
        run: node tools/release/crates.mjs

  publish:
    needs: check
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          cache-key: crates
          tools: cargo-release-oxc@0.0.44

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # cargo-release-oxc writes target/CRATES_VERSION even with a custom CARGO_TARGET_DIR.
          node -e 'require("node:fs").mkdirSync("target", { recursive: true })'
          cargo release-oxc publish --release crates
