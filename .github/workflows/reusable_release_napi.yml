name: Build and publish NAPI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ github.event_name == 'workflow_dispatch' || steps.version.outputs.release == 'true' }}
      matrix: ${{ steps.version.outputs.matrix }}
      ts_nightly: ${{ steps.ts.outputs.nightly }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - name: Check independent npm version
        id: version
        run: node napi/scripts/release.mjs version
      - name: Read TypeScript version
        id: ts
        run: echo "nightly=$(node npm/build.mjs --print-typescript-nightly)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    env:
      TSRS_TS_VERSION: ${{ needs.version.outputs.ts_nightly }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          restore-cache: false
      - run: rustup target add ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: contains(matrix.target, 'musl')
        with:
          version: 0.13.0
      - name: RISC-V toolchain
        if: startsWith(matrix.target, 'riscv64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
          echo 'TARGET_CC=riscv64-linux-gnu-gcc' >> "$GITHUB_ENV"
          echo 'CXX=riscv64-linux-gnu-g++' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - name: s390x linker
        if: startsWith(matrix.target, 's390x')
        run: echo 'CFLAGS=-fuse-ld=lld' >> "$GITHUB_ENV"
      - name: Build native addon
        run: pnpm --dir napi build --target ${{ matrix.target }} ${{ matrix.flags }}
      - name: Check native behavior and installed tarballs
        if: matrix.test
        run: |
          cargo build --profile dev --locked -p tsrs_cli
          pnpm --dir napi test
          node napi/scripts/release.mjs assemble napi/src-js ${{ matrix.target }}
          node napi/scripts/smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-bindings-${{ matrix.target }}
          path: |
            napi/src-js/*.node
            napi/src-js/binding.cjs
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: github.repository == 'oxc-project/tsrs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      PRIVATE_REPO: ${{ github.event.repository.private }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: napi-bindings-*
          path: napi/artifacts
      - name: Assemble all platform packages
        run: node napi/scripts/release.mjs assemble
      - name: Check installed release tarballs
        run: node napi/scripts/smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-packages
          path: |
            napi/dist/tarballs/*.tgz
            napi/dist/packages.json
          if-no-files-found: error
      - name: Publish platforms, then main package
        run: node napi/scripts/release.mjs publish
