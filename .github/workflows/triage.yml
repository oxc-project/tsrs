# Automatically investigates bug reports and can open a pull request with a verified fix.
# Repository setup required before this job will run:
#   - Install the oxc-guard GitHub App on this repository with Contents, Issues,
#     and Pull requests write access.
#   - CAPTAIN_ID: the oxc-guard GitHub App's client ID, as a repository secret.
#   - CAPTAIN_KEY: the oxc-guard GitHub App's private key.
#   - CLOUDFLARE_API_KEY: a Workers AI API token with Workers AI Read and Edit.
#   - CLOUDFLARE_ACCOUNT_ID: the Workers AI account ID.

name: Issue Triage

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  # Bot comments can enqueue another event before the issue's label is updated.
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      !github.event.issue.pull_request &&
      (github.event.action != 'created' ||
       (github.event.comment.user.login != 'github-actions[bot]' &&
        github.event.comment.user.login != 'oxc-guard[bot]'))
    runs-on: ubuntu-24.04
    # GitHub App installation tokens expire after one hour.
    timeout-minutes: 55
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Route using current issue state
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/triage/route.mjs

      - name: Set up Node.js
        if: steps.route.outputs.route != 'skip'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Rust
        if: steps.route.outputs.route == 'triage' || steps.route.outputs.route == 'retriage'
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          # Issue events can restore main's caches but cannot save into that scope.
          save-cache: false
          cache-key: warm-test

      - name: Read TypeScript reference commit
        if: steps.route.outputs.route == 'triage' || steps.route.outputs.route == 'retriage'
        id: reference
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned reference compiler
        if: steps.reference.outputs.commit != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ts-ref
            target/triage/tsgo
            target/triage/reference.json
          key: triage-reference-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.reference.outputs.commit }}

      - name: Create oxc-guard token
        if: steps.route.outputs.route != 'skip'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.CAPTAIN_ID }}
          private-key: ${{ secrets.CAPTAIN_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Configure Git identity
        if: steps.route.outputs.route != 'skip'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_user_id="$(gh api 'users/oxc-guard[bot]' --jq .id)"
          git config user.name "oxc-guard[bot]"
          git config user.email "${bot_user_id}+oxc-guard[bot]@users.noreply.github.com"

      # The pinned action expects its state labels plus at least one "- P" and
      # "pkg:" label, but does not create them itself.
      - name: Create missing triage labels
        if: steps.route.outputs.route != 'skip' && steps.route.outputs.route != 'cleanup'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/setup-triagebot-labels.sh

      - name: Triage the issue
        if: steps.route.outputs.route != 'skip'
        # Keep upstream unchanged; setup and skill guidance live in this repository.
        uses: withastro/triagebot-action@51d30da13c0bd571a3822fc56882de40fead0086 # main, 2026-08-28
        with:
          read-token: ${{ github.token }}
          write-token: ${{ steps.app-token.outputs.token }}
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          triage-model: cloudflare-workers-ai/@cf/moonshotai/kimi-k2.7-code
          verification-model: cloudflare-workers-ai/@cf/moonshotai/kimi-k2.6
          triage-skill: .agents/skills/triage
          pr-skill: .agents/skills/pr-writer
          auto-pr-on-fix: true
          bot-logins: oxc-guard[bot]

      - name: Retain triage evidence
        if: always() && (steps.route.outputs.route == 'triage' || steps.route.outputs.route == 'retriage')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: |
            triage/**/report.md
            target/triage/*.json
          if-no-files-found: ignore
          retention-days: 14
