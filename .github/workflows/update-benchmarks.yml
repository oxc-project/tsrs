name: Update benchmarks

on:
  push:
    branches: [main]
    paths:
      - bench/projects.json
      - .github/workflows/update-benchmarks.yml
  workflow_dispatch:

concurrency:
  group: update-benchmarks-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'oxc-project/tsrs'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: ""

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          components: llvm-tools
          save-cache: true
          cache-key: bench-pgo

      - name: Plan benchmark
        id: plan
        run: |
          echo "projects=$(python3 bench/run.py --print-projects)" >> "$GITHUB_OUTPUT"
          echo "reference=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"
          python3 bench/run.py --print-cache-keys --projects xstate-main,webpack >> "$GITHUB_OUTPUT"

      # PGO training needs both fixtures and the pinned Go fourslash source checkout.
      - name: Check out TypeScript source and fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.plan.outputs.reference }}
          path: ts-ref
          sparse-checkout: tsc
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.15'

      - name: Cache suite and TypeScript compilers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.plan.outputs.shared }}

      - name: Cache training projects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/solutions/xstate-main
            bench/.work/solutions/webpack
          key: bench-training-${{ runner.os }}-${{ steps.plan.outputs['xstate-main'] }}-${{ steps.plan.outputs.webpack }}

      - name: Build benchmark compilers
        run: |
          # Build the same PGO + BOLT tsrs binary used by releases, and share one Bun canary across all measuring jobs.
          set -euo pipefail

          target=x86_64-unknown-linux-gnu
          work="$RUNNER_TEMP/benchmark-build"
          mkdir -p "$work/raw" "$work/dist" "$work/llvm"
          rustup target add "$target"
          python3 bench/run.py --setup-only --projects xstate-main,webpack

          # Keep profile settings identical between builds so PGO matches their symbol names.
          export CARGO_PROFILE_RELEASE_STRIP=none
          RUSTFLAGS="-Cprofile-generate=$work/raw -Clto=thin" \
            cargo build --release --locked -p tsrs_cli -p tsrs_testrunner -p tsrs_fourslash_server --bins --target "$target"
          .github/scripts/pgo-train.sh "target/$target/release" "$work/raw" bench/.work

          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          "$profdata" merge -o "$work/merged.profdata" "$work"/raw/*.profraw
          sum=$(shasum -a 256 "$work/merged.profdata" | cut -c1-16)
          mv "$work/merged.profdata" "$work/$sum.profdata"
          RUSTFLAGS="-Cprofile-use=$work/$sum.profdata -Clink-arg=-Wl,--emit-relocs" CARGO_TARGET_DIR="$work/target" \
            cargo build --release --locked -p tsrs_cli --target "$target"

          llvm=$(rustc -vV | sed -n 's/^LLVM version: //p')
          name="LLVM-$llvm-Linux-X64"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvm/$name.tar.zst" -o "$work/llvm.tar.zst"
          tar -xf "$work/llvm.tar.zst" --zstd -C "$work/llvm" --strip-components=1 --wildcards \
            "$name/bin/llvm-bolt" "$name/bin/merge-fdata" "$name/lib/libbolt_rt_instr.a"
          PATH="$work/llvm/bin:$PATH" BOLT_TSRS_ONLY=1 \
            .github/scripts/bolt.sh "$work/target/$target/release" "$work/bolt" bench/.work

          cp "$work/target/$target/release/tsrs" "$work/dist/tsrs"
          rustc -V > "$work/dist/rustc.txt"
          curl -fsSL --retry 3 --retry-all-errors \
            https://github.com/oven-sh/bun/releases/download/canary/bun-linux-x64.zip -o "$work/bun.zip"
          unzip -oq "$work/bun.zip" -d "$work"
          cp "$work/bun-linux-x64/bun" "$work/dist/bun"
          "$work/dist/tsrs" --version
          "$work/dist/bun" --revision
          "$work/dist/bun" check --help > /dev/null
          sha256sum "$work/dist/tsrs" "$work/dist/bun"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-compilers
          path: ${{ runner.temp }}/benchmark-build/dist
          if-no-files-found: error
          retention-days: 3

  measure:
    needs: build
    # 8 vCPUs, so the chart's 8-checker point runs one checker per core.
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.build.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
      BENCH_RUNNER: Namespace `nscloud-ubuntu-24.04-amd64-8x16`
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Prepare benchmark runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          mem_gb=$(awk '/MemTotal/ {printf "%d", $2 / 1048576}' /proc/meminfo)
          if [ "$(nproc)" != 8 ] || [ "$mem_gb" -lt 14 ] || [ "$(uname -m)" != x86_64 ]; then
            echo "::error::expected 8 vCPU / 16 GB / x86_64"; exit 1
          fi

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: ""

      - name: Cache keys
        id: keys
        run: python3 bench/run.py --print-cache-keys --projects "$PROJECT" | sed "s/^$PROJECT=/project=/" >> "$GITHUB_OUTPUT"

      - name: Restore suite and TypeScript compilers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Cache project
        if: steps.keys.outputs.project != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench/.work/solutions/${{ matrix.project }}
          key: bench-${{ matrix.project }}-${{ runner.os }}-${{ steps.keys.outputs.project }}

      - name: Set up project
        run: python3 bench/run.py --setup-only --projects "$PROJECT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-compilers
          path: ${{ runner.temp }}/benchmark-compilers

      - name: Measure chart modes
        run: |
          bin="$RUNNER_TEMP/benchmark-compilers"
          chmod +x "$bin/tsrs" "$bin/bun"
          sha256sum "$bin/tsrs" "$bin/bun"
          python3 bench/run.py --projects "$PROJECT" --modes wide,checkers1,checkers2,checkers4,checkers8 \
            --tsrs "$bin/tsrs" --tsrs-build pgo-dist --rustc "$(cat "$bin/rustc.txt")" --bun "$bin/bun" \
            --out-dir "$RUNNER_TEMP/bench-partial/$PROJECT" --reps 10 --tsgo-reps 3

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-partial-${{ matrix.project }}
          path: ${{ runner.temp }}/bench-partial/${{ matrix.project }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-logs-${{ matrix.project }}
          path: bench/.work/logs
          if-no-files-found: ignore

  publish:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Fetch benchmark history
        run: git fetch --unshallow origin main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-partial-*
          path: ${{ runner.temp }}/bench-partials

      - name: Merge results
        run: python3 bench/run.py --merge "$RUNNER_TEMP"/bench-partials/*/*.json --out-dir "$RUNNER_TEMP/bench-merged"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-result
          path: ${{ runner.temp }}/bench-merged
          if-no-files-found: error

      - name: Create GitHub App token
        if: github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open results PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          results=("$RUNNER_TEMP"/bench-merged/*.json)
          [ "${#results[@]}" -eq 1 ]
          result="${results[0]}"
          measured=$(git rev-parse --verify "$(jq -r '.tsrs.commit' "$result")^{commit}")
          git fetch -q origin main
          if ! jq -e '.tsrs.dirty == false' "$result" > /dev/null || ! git merge-base --is-ancestor "$measured" origin/main; then
            echo "Keeping results as an artifact: the measured commit is not a clean commit on main."
            exit 0
          fi

          git checkout -q -f -B main origin/main
          mkdir -p bench/results
          cp "$result" "${result%.json}.md" bench/results/
          python3 bench/publish.py "$result"
          git add bench/RESULTS.md 'bench/large-projects*.svg' 'bench/per-project-*.svg'
          git add -f "bench/results/$(basename "$result")" "bench/results/$(basename "${result%.json}.md")"
          git diff --cached --quiet && exit 0

          gh auth setup-git
          branch="bench/results-$measured"
          title="chore(bench): update results for ${measured:0:12}"
          previous=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          # Create the commit through GitHub so the app token supplies its attribution.
          while IFS= read -r -d '' path; do
            git show ":$path" | jq -Rs --arg path "$path" '{path: $path, mode: "100644", type: "blob", content: .}'
          done < <(git diff --cached --name-only -z) |
            jq -s --arg base_tree "$(git rev-parse 'HEAD^{tree}')" '{base_tree: $base_tree, tree: .}' > "$RUNNER_TEMP/bench-tree.json"
          tree=$(gh api --method POST "repos/$GH_REPO/git/trees" --input "$RUNNER_TEMP/bench-tree.json" --jq .sha)
          commit=$(gh api "repos/$GH_REPO/git/commits" -f message="$title" -f tree="$tree" \
            -f "parents[]=$(git rev-parse HEAD)" --jq .sha)
          git fetch -q origin "$commit"
          git push "--force-with-lease=refs/heads/$branch:$previous" origin "$commit:refs/heads/$branch"

          printf 'Regenerate benchmark reports and README charts for `%s` against TypeScript `%s`.\n\n[Benchmark run](%s).\n' \
            "${measured:0:12}" "$(jq -r '.tsgo.version' "$result")" "$RUN_URL" > "$RUNNER_TEMP/bench-pr.md"
          pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/bench-pr.md"
          else
            gh pr create --draft --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/bench-pr.md"
          fi
