name: Update benchmarks

on:
  push:
    branches: [main]
    paths:
      - bench/projects.json
      - .github/workflows/update-benchmarks.yml
  workflow_dispatch:

concurrency:
  group: update-benchmarks-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'oxc-project/tsrs'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: ""

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          components: llvm-tools
          save-cache: true
          cache-key: bench-pgo

      - name: Plan benchmark
        id: plan
        run: |
          echo "projects=$(python3 bench/run.py --print-projects --projects all)" >> "$GITHUB_OUTPUT"
          echo "reference=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"
          python3 bench/run.py --print-cache-keys --projects xstate-main,webpack >> "$GITHUB_OUTPUT"

      # PGO training needs both fixtures and the pinned Go fourslash source checkout.
      - name: Check out TypeScript source and fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.plan.outputs.reference }}
          path: ts-ref
          sparse-checkout: tsc
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.15'

      - name: Cache suite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
          key: bench-shared-${{ runner.os }}-${{ steps.plan.outputs.shared }}

      - name: Cache training projects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/solutions/xstate-main
            bench/.work/solutions/webpack
          key: bench-training-${{ runner.os }}-${{ steps.plan.outputs['xstate-main'] }}-${{ steps.plan.outputs.webpack }}

      - name: Build benchmark compilers
        run: |
          # Build the same PGO + BOLT tsrs binary used by releases.
          set -euo pipefail

          target=x86_64-unknown-linux-gnu
          work="$RUNNER_TEMP/benchmark-build"
          mkdir -p "$work/raw" "$work/dist" "$work/llvm"
          rustup target add "$target"
          python3 bench/run.py --setup-only --projects xstate-main,webpack

          # Keep profile settings identical between builds so PGO matches their symbol names.
          export CARGO_PROFILE_RELEASE_STRIP=none
          RUSTFLAGS="-Cprofile-generate=$work/raw -Clto=thin" \
            cargo build --release --locked -p tsrs_cli -p tsrs_testrunner -p tsrs_fourslash_server --bins --target "$target"
          .github/scripts/pgo-train.sh "target/$target/release" "$work/raw" bench/.work

          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          "$profdata" merge -o "$work/merged.profdata" "$work"/raw/*.profraw
          sum=$(shasum -a 256 "$work/merged.profdata" | cut -c1-16)
          mv "$work/merged.profdata" "$work/$sum.profdata"
          RUSTFLAGS="-Cprofile-use=$work/$sum.profdata -Clink-arg=-Wl,--emit-relocs" CARGO_TARGET_DIR="$work/target" \
            cargo build --release --locked -p tsrs_cli --target "$target"

          llvm=$(rustc -vV | sed -n 's/^LLVM version: //p')
          name="LLVM-$llvm-Linux-X64"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvm/$name.tar.zst" -o "$work/llvm.tar.zst"
          tar -xf "$work/llvm.tar.zst" --zstd -C "$work/llvm" --strip-components=1 --wildcards \
            "$name/bin/llvm-bolt" "$name/bin/merge-fdata" "$name/lib/libbolt_rt_instr.a"
          PATH="$work/llvm/bin:$PATH" BOLT_TSRS_ONLY=1 \
            .github/scripts/bolt.sh "$work/target/$target/release" "$work/bolt" bench/.work

          cp "$work/target/$target/release/tsrs" "$work/dist/tsrs"
          cargo install hyperfine --version 2.0.0 --locked --root "$work/hyperfine"
          cp "$work/hyperfine/bin/hyperfine" "$work/dist/hyperfine"
          "$work/dist/tsrs" --version
          "$work/dist/hyperfine" --version
          sha256sum "$work/dist/tsrs" "$work/dist/hyperfine"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-compilers
          path: ${{ runner.temp }}/benchmark-build/dist
          if-no-files-found: error
          retention-days: 14

  measure:
    needs: build
    # Each project uses the same single configuration: 4 checkers and 8 worker CPUs.
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.build.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
      BENCH_RUNNER: Namespace `nscloud-ubuntu-24.04-amd64-8x16`
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Prepare benchmark runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          mem_gb=$(awk '/MemTotal/ {printf "%d", $2 / 1048576}' /proc/meminfo)
          if [ "$(nproc)" != 8 ] || [ "$mem_gb" -lt 14 ] || [ "$(uname -m)" != x86_64 ]; then
            echo "::error::expected 8 vCPU / 16 GB / x86_64"; exit 1
          fi

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: ""

      - name: Cache keys
        id: keys
        run: python3 bench/run.py --print-cache-keys --projects "$PROJECT" | sed "s/^$PROJECT=/project=/" >> "$GITHUB_OUTPUT"

      - name: Restore suite
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Cache project
        if: steps.keys.outputs.project != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench/.work/solutions/${{ matrix.project }}
          key: bench-${{ matrix.project }}-${{ runner.os }}-${{ steps.keys.outputs.project }}

      - name: Set up project
        run: python3 bench/run.py --setup-only --projects "$PROJECT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-compilers
          path: ${{ runner.temp }}/benchmark-compilers

      - name: Measure compilers
        run: |
          bin="$RUNNER_TEMP/benchmark-compilers"
          chmod +x "$bin/tsrs" "$bin/hyperfine"
          python3 bench/run.py --projects "$PROJECT" --typescript-versions next 7.0.2 \
            --tsrs "$bin/tsrs" --hyperfine "$bin/hyperfine" --checkers 4 --workers 8 \
            --out-dir "$RUNNER_TEMP/bench-partial/$PROJECT" --runs 10 --warmup 3

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Draw both chart styles
        run: |
          python -m pip install -r bench/requirements-charts.txt
          for result in "$RUNNER_TEMP/bench-partial/$PROJECT"/*; do
            python bench/chart.py "$result" --output "$result/scatter.svg"
            python bench/chart_bars.py "$result"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-partial-${{ matrix.project }}
          path: ${{ runner.temp }}/bench-partial/${{ matrix.project }}
          if-no-files-found: error
          retention-days: 14


      # Raw samples and figures are downloadable artifacts; this workflow never commits results.
