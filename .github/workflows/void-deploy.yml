name: Playground

on:
  # Called by release.yml only after the GitHub release is published.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # Setup actions read the shared event file; keep them sequential.
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: ""

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: playground

      - name: Install Chromium
        id: chromium
        background: true
        working-directory: playground
        run: pnpm exec playwright install --with-deps chromium

      - name: Download validated release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-wasm
          path: ${{ runner.temp }}/npm-wasm

      - name: Restore validated release WASM
        run: node .github/scripts/restore-release-wasm.mjs "$RUNNER_TEMP/npm-wasm"

      - name: Build native reference
        id: native
        background: true
        run: cargo build --profile dev --locked -p tsrs_cli

      - name: Check and build playground
        working-directory: playground
        run: |
          pnpm run prepare-assets
          pnpm exec vp check
          pnpm exec vp build

      - wait: native

      - name: Compare WASM with native tsrs
        working-directory: playground
        run: pnpm exec vp test run

      - wait: chromium

      - name: Verify production build in Chromium
        working-directory: playground
        run: pnpm run test:browser

      - name: Save validated site
        if: github.repository == 'oxc-project/tsrs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-${{ github.sha }}
          path: playground/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'oxc-project/tsrs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: playground-production
      cancel-in-progress: false
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: ""

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playground-${{ github.sha }}
          path: playground/dist/

      - name: Install Chromium
        id: chromium
        background: true
        working-directory: playground
        run: pnpm exec playwright install --with-deps chromium

      - name: Deploy to Void using OIDC
        run: |
          pnpm exec void connect https://api.void.cloud --no-login
          pnpm exec void deploy --platform void --project tsrs-playground --dir playground/dist

      - wait: chromium

      - name: Verify hosted playground
        working-directory: playground
        env:
          PLAYWRIGHT_BASE_URL: https://tsrs-playground.void.app
        run: |
          pnpm run test:browser
          echo "Playground: $PLAYWRIGHT_BASE_URL (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
