name: PR performance benchmark

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '.github/**'
      - 'bench/**'
      - 'docs/**'
      - 'notes/**'
      - '*.md'
      - '**/*.md'

concurrency:
  group: wallclock-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  decide:
    if: github.repository == 'oxc-project/tsrs' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.clef.outputs.run }}
      reason: ${{ steps.clef.outputs.reason }}
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      # Only same-repository PRs reach this job. The PR merge checkout includes
      # this workflow's helper script before it has landed on main.
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: ./.github/actions/setup-node-tools

      - name: List benchmark projects
        id: projects
        run: |
          projects=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.stringify(JSON.parse(fs.readFileSync("bench/projects.json", "utf8")).projects.map(p => p.name)))')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

      - name: Ask Clef whether performance measurement is needed
        id: clef
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: node bench/wallclock.mjs decide

  build-main:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # CI publishes this exact source/configuration; a missing entry builds the base normally.
      - name: Restore main CLI
        id: cli
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release/tsrs
          key: wallclock-cli-v1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.event.pull_request.base.sha }}

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        if: steps.cli.outputs.cache-hit != 'true'
        with:
          save-cache: false
          cache-key: wallclock-release

      - name: Build main CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p tsrs_cli

      - name: Verify main CLI
        run: target/release/tsrs --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wallclock-main-cli
          path: target/release/tsrs
          if-no-files-found: error
          retention-days: 7

  build-pr:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: false
          cache-key: wallclock-release

      # This job has read-only repository access and no Cloudflare secrets.
      - name: Build PR CLI
        run: |
          cargo build --release --locked -p tsrs_cli
          target/release/tsrs --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wallclock-pr-cli
          path: target/release/tsrs
          if-no-files-found: error
          retention-days: 7

  check-binaries:
    needs: [decide, build-main, build-pr]
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      identical: ${{ steps.binaries.outputs.identical }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wallclock-main-cli
          path: ${{ runner.temp }}/wallclock-binaries/main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wallclock-pr-cli
          path: ${{ runner.temp }}/wallclock-binaries/pr

      - name: Check binaries
        id: binaries
        run: |
          chmod +x "$RUNNER_TEMP/wallclock-binaries/main/tsrs" "$RUNNER_TEMP/wallclock-binaries/pr/tsrs"
          sha256sum "$RUNNER_TEMP/wallclock-binaries/main/tsrs" "$RUNNER_TEMP/wallclock-binaries/pr/tsrs"
          if cmp -s "$RUNNER_TEMP/wallclock-binaries/main/tsrs" "$RUNNER_TEMP/wallclock-binaries/pr/tsrs"; then
            echo "identical=true" >> "$GITHUB_OUTPUT"
          else
            echo "identical=false" >> "$GITHUB_OUTPUT"
          fi

  measure:
    needs: [decide, check-binaries]
    if: needs.check-binaries.outputs.identical == 'false'
    # Each project has a dedicated runner, so other projects do not affect its measurements.
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.decide.outputs.projects || '[]') }}
    permissions:
      contents: read
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wallclock-main-cli
          path: ${{ runner.temp }}/wallclock-binaries/main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wallclock-pr-cli
          path: ${{ runner.temp }}/wallclock-binaries/pr

      - name: Prepare binaries
        run: chmod +x "$RUNNER_TEMP/wallclock-binaries/main/tsrs" "$RUNNER_TEMP/wallclock-binaries/pr/tsrs"

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: hyperfine@2.0.0
          fallback: none

      - name: Enable hardware counters
        run: sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Runner information
        run: |
          nproc
          free -h
          hyperfine --version

      - uses: ./.github/actions/setup-node-tools

      - name: Cache keys
        id: keys
        run: node bench/bench.mjs plan --format keys --projects "$PROJECT" | sed "s/^$PROJECT=/project=/" >> "$GITHUB_OUTPUT"

      - name: Restore shared benchmark checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Restore benchmark project
        if: steps.keys.outputs.project != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/.work/solutions/${{ matrix.project }}
          key: bench-${{ matrix.project }}-${{ runner.os }}-${{ steps.keys.outputs.project }}

      - name: Compare main and PR with Hyperfine
        run: |
          benchmark_status=0
          for mode in check incremental; do
            node bench/wallclock.mjs measure --project "$PROJECT" --mode "$mode" \
              --base "$RUNNER_TEMP/wallclock-binaries/main/tsrs" \
              --head "$RUNNER_TEMP/wallclock-binaries/pr/tsrs" \
              --out "$RUNNER_TEMP/wallclock-results/$PROJECT.$mode.json" --runs 10 || benchmark_status=1
          done
          exit "$benchmark_status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wallclock-results-${{ matrix.project }}
          path: ${{ runner.temp }}/wallclock-results
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [decide, check-binaries, measure]
    if: always() && needs.decide.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.check-binaries.outputs.identical == 'false'
        continue-on-error: true
        with:
          pattern: wallclock-results-*
          path: ${{ runner.temp }}/wallclock-results
          merge-multiple: true

      - uses: ./.github/actions/setup-node-tools

      - name: Join project measurements
        if: needs.check-binaries.outputs.identical == 'false'
        run: node bench/wallclock.mjs join --results "$RUNNER_TEMP/wallclock-results" --out "$RUNNER_TEMP/wallclock-joined.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check-binaries.outputs.identical == 'false'
        with:
          name: wallclock-joined
          path: ${{ runner.temp }}/wallclock-joined.json
          if-no-files-found: error
          retention-days: 7

      - name: Update PR benchmark comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          DECISION: ${{ needs.decide.outputs.run }}
          IDENTICAL: ${{ needs.check-binaries.outputs.identical }}
          REASON: ${{ needs.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node bench/wallclock.mjs comment --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --merge-sha "$MERGE_SHA" --run-url "$RUN_URL" \
            --decision "$DECISION" --identical "$IDENTICAL" --reason "$REASON" \
            --results "$RUNNER_TEMP/wallclock-joined.json"
