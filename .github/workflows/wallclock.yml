name: PR performance benchmark

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '.github/**'
      - 'bench/**'
      - 'docs/**'
      - 'notes/**'
      - '*.md'
      - '**/*.md'

concurrency:
  group: wallclock-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  decide:
    if: github.repository == 'oxc-project/tsrs' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.clef.outputs.run }}
      reason: ${{ steps.clef.outputs.reason }}
    steps:
      # Only same-repository PRs reach this job. The PR merge checkout includes
      # this workflow's helper script before it has landed on main.
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Ask Clef whether performance measurement is needed
        id: clef
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: python3 bench/wallclock.py decide

  build-main:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: false
          cache-key: wallclock-release

      - name: Build main CLI
        run: |
          cargo build --release --locked -p tsrs_cli
          target/release/tsrs --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallclock-main-cli
          path: target/release/tsrs
          if-no-files-found: error
          retention-days: 7

  build-pr:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: false
          cache-key: wallclock-release

      # This job has read-only repository access and no Cloudflare secrets.
      - name: Build PR CLI
        run: |
          cargo build --release --locked -p tsrs_cli
          target/release/tsrs --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallclock-pr-cli
          path: target/release/tsrs
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: [decide, build-main, build-pr]
    if: needs.decide.outputs.run == 'true'
    # Reuse the runner where the main benchmark already measures instruction counts.
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      identical: ${{ steps.binaries.outputs.identical }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wallclock-main-cli
          path: ${{ runner.temp }}/wallclock-binaries/main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wallclock-pr-cli
          path: ${{ runner.temp }}/wallclock-binaries/pr

      - name: Check binaries
        id: binaries
        run: |
          chmod +x "$RUNNER_TEMP/wallclock-binaries/main/tsrs" "$RUNNER_TEMP/wallclock-binaries/pr/tsrs"
          sha256sum "$RUNNER_TEMP/wallclock-binaries/main/tsrs" "$RUNNER_TEMP/wallclock-binaries/pr/tsrs"
          if cmp -s "$RUNNER_TEMP/wallclock-binaries/main/tsrs" "$RUNNER_TEMP/wallclock-binaries/pr/tsrs"; then
            echo "identical=true" >> "$GITHUB_OUTPUT"
          else
            echo "identical=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        if: steps.binaries.outputs.identical != 'true'
        with:
          tool: hyperfine
          fallback: none

      - name: Runner information
        if: steps.binaries.outputs.identical != 'true'
        run: |
          nproc
          free -h
          hyperfine --version

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.binaries.outputs.identical != 'true'
        with:
          registry-url: ""

      - name: Cache keys
        id: keys
        if: steps.binaries.outputs.identical != 'true'
        run: python3 bench/run.py --print-cache-keys --projects Compiler | sed -n '/^shared=/p' >> "$GITHUB_OUTPUT"

      - name: Restore shared benchmark checkout
        if: steps.binaries.outputs.identical != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bench/.work/suite
            bench/.work/tsgo
          key: bench-shared-${{ runner.os }}-${{ steps.keys.outputs.shared }}

      - name: Compare main and PR with Hyperfine
        if: steps.binaries.outputs.identical != 'true'
        run: |
          projects=$(python3 -c 'import json; from pathlib import Path; print("\n".join(p["name"] for p in json.loads(Path("bench/projects.json").read_text())["projects"]))')
          failed=0
          while IFS= read -r project; do
            if ! python3 bench/wallclock.py measure --project "$project" \
              --base "$RUNNER_TEMP/wallclock-binaries/main/tsrs" \
              --head "$RUNNER_TEMP/wallclock-binaries/pr/tsrs" \
              --out "$RUNNER_TEMP/wallclock-results/$project.json" --runs 10; then
              failed=1
            fi
            rm -rf "bench/.work/solutions/$project"
          done <<< "$projects"
          exit "$failed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.binaries.outputs.identical == 'false'
        with:
          name: wallclock-results
          path: ${{ runner.temp }}/wallclock-results
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [decide, build-main, build-pr, compare]
    if: always() && needs.decide.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.decide.outputs.run == 'true' && needs.compare.outputs.identical == 'false'
        continue-on-error: true
        with:
          name: wallclock-results
          path: ${{ runner.temp }}/wallclock-results

      - name: Update PR benchmark comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          DECISION: ${{ needs.decide.outputs.run }}
          IDENTICAL: ${{ needs.compare.outputs.identical }}
          REASON: ${{ needs.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 bench/wallclock.py comment --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --merge-sha "$MERGE_SHA" --run-url "$RUN_URL" \
            --decision "$DECISION" --identical "$IDENTICAL" --reason "$REASON" \
            --results "$RUNNER_TEMP/wallclock-results"
