<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title description">
  <title id="title">tsrs vs TypeScript 7.1 beta</title>
  <desc id="description">Top 6 of 19 projects by tsrs --fast wall-time speedup over TypeScript. Each compiler with its default settings on an Apple M3 Max (14 cores); median of 10 interleaved runs (5 for TypeScript). mikro-orm: check time tsrs --fast 0.70 s, 6.6× faster; tsrs (default) 1.38 s, 3.4× faster; TypeScript 7.1 beta 4.63 s. peak memory tsrs --fast 1.81 GiB, 2.3× less; tsrs (default) 1.59 GiB, 2.6× less; TypeScript 7.1 beta 4.20 GiB. t3code-server: check time tsrs --fast 1.19 s, 6.0× faster; tsrs (default) 1.73 s, 4.2× faster; TypeScript 7.1 beta 7.20 s. peak memory tsrs --fast 1.95 GiB, 2.2× less; tsrs (default) 1.82 GiB, 2.4× less; TypeScript 7.1 beta 4.36 GiB. next-packages-next: check time tsrs --fast 0.25 s, 6.0× faster; tsrs (default) 0.53 s, 2.8× faster; TypeScript 7.1 beta 1.47 s. peak memory tsrs --fast 0.62 GiB, 2.2× less; tsrs (default) 0.61 GiB, 2.2× less; TypeScript 7.1 beta 1.36 GiB. vscode: check time tsrs --fast 0.91 s, 5.8× faster; tsrs (default) 2.01 s, 2.6× faster; TypeScript 7.1 beta 5.27 s. peak memory tsrs --fast 1.99 GiB, 2.7× less; tsrs (default) 2.36 GiB, 2.3× less; TypeScript 7.1 beta 5.46 GiB. supabase: check time tsrs --fast 0.79 s, 5.1× faster; tsrs (default) 1.47 s, 2.7× faster; TypeScript 7.1 beta 4.01 s. peak memory tsrs --fast 1.54 GiB, 2.1× less; tsrs (default) 1.37 GiB, 2.3× less; TypeScript 7.1 beta 3.20 GiB. webpack: check time tsrs --fast 0.16 s, 4.7× faster; tsrs (default) 0.28 s, 2.6× faster; TypeScript 7.1 beta 0.74 s. peak memory tsrs --fast 0.47 GiB, 1.8× less; tsrs (default) 0.40 GiB, 2.1× less; TypeScript 7.1 beta 0.82 GiB. Shorter bars are better.</desc>
