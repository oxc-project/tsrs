  <title id="title">tsrs vs TypeScript 7.1 beta</title>
  <desc id="description">Top 6 of 19 projects by tsrs --fast wall-time speedup over TypeScript. Each compiler with its default settings on an Apple M3 Max (14 cores); median of 10 interleaved runs (5 for TypeScript). mikro-orm: check time tsrs --fast 0.70 s, 6.6× faster; tsrs (default) 1.37 s, 3.4× faster; TypeScript 7.1 beta 4.60 s. peak memory tsrs --fast 1.79 GiB, 2.3× less; tsrs (default) 1.60 GiB, 2.6× less; TypeScript 7.1 beta 4.15 GiB. next-packages-next: check time tsrs --fast 0.23 s, 6.3× faster; tsrs (default) 0.52 s, 2.8× faster; TypeScript 7.1 beta 1.46 s. peak memory tsrs --fast 0.62 GiB, 2.2× less; tsrs (default) 0.61 GiB, 2.2× less; TypeScript 7.1 beta 1.35 GiB. t3code-server: check time tsrs --fast 1.19 s, 6.0× faster; tsrs (default) 1.70 s, 4.2× faster; TypeScript 7.1 beta 7.12 s. peak memory tsrs --fast 1.95 GiB, 2.2× less; tsrs (default) 1.82 GiB, 2.4× less; TypeScript 7.1 beta 4.38 GiB. vscode: check time tsrs --fast 0.85 s, 6.0× faster; tsrs (default) 1.98 s, 2.6× faster; TypeScript 7.1 beta 5.08 s. peak memory tsrs --fast 2.00 GiB, 2.7× less; tsrs (default) 2.36 GiB, 2.3× less; TypeScript 7.1 beta 5.48 GiB. supabase: check time tsrs --fast 0.78 s, 5.1× faster; tsrs (default) 1.46 s, 2.8× faster; TypeScript 7.1 beta 4.01 s. peak memory tsrs --fast 1.54 GiB, 2.0× less; tsrs (default) 1.38 GiB, 2.3× less; TypeScript 7.1 beta 3.15 GiB. webpack: check time tsrs --fast 0.14 s, 4.9× faster; tsrs (default) 0.27 s, 2.6× faster; TypeScript 7.1 beta 0.71 s. peak memory tsrs --fast 0.47 GiB, 1.8× less; tsrs (default) 0.40 GiB, 2.1× less; TypeScript 7.1 beta 0.84 GiB. Shorter bars are better.</desc>
