<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-labelledby="title description">
  <title id="title">tsrs vs TypeScript 7.1 nightly</title>
  <desc id="description">How many times faster tsrs type-checks than tsgo (TypeScript 7.1 nightly), against how many times less peak memory it uses, both compilers at --checkers 1, 2, 4 and 8 on an 8-vCPU Linux machine. Up and to the right is better. vscode: --checkers 1: 2.5x faster, 2.9x less memory (tsgo 27.07 s, 4.61 GiB; tsrs 10.82 s, 1.59 GiB); --checkers 2: 3.0x faster, 2.9x less memory (tsgo 17.53 s, 4.93 GiB; tsrs 5.79 s, 1.68 GiB); --checkers 4: 3.5x faster, 3.1x less memory (tsgo 10.91 s, 5.38 GiB; tsrs 3.08 s, 1.76 GiB); --checkers 8: 4.5x faster, 3.1x less memory (tsgo 8.37 s, 5.90 GiB; tsrs 1.87 s, 1.89 GiB). mui-docs: --checkers 1: 3.6x faster, 2.7x less memory (tsgo 13.66 s, 1.99 GiB; tsrs 3.78 s, 0.75 GiB); --checkers 2: 3.7x faster, 2.9x less memory (tsgo 9.91 s, 2.51 GiB; tsrs 2.64 s, 0.86 GiB); --checkers 4: 4.2x faster, 3.3x less memory (tsgo 8.34 s, 3.38 GiB; tsrs 2.00 s, 1.02 GiB); --checkers 8: 4.6x faster, 3.5x less memory (tsgo 7.50 s, 4.50 GiB; tsrs 1.62 s, 1.27 GiB). t3code-server: --checkers 1: 3.5x faster, 3.4x less memory (tsgo 22.32 s, 2.47 GiB; tsrs 6.38 s, 0.74 GiB); --checkers 2: 4.4x faster, 3.2x less memory (tsgo 19.74 s, 2.89 GiB; tsrs 4.52 s, 0.91 GiB); --checkers 4: 5.1x faster, 3.9x less memory (tsgo 16.02 s, 4.43 GiB; tsrs 3.13 s, 1.14 GiB); --checkers 8: 5.3x faster, 3.8x less memory (tsgo 15.07 s, 5.74 GiB; tsrs 2.82 s, 1.50 GiB). supabase: --checkers 1: 2.8x faster, 2.6x less memory (tsgo 17.73 s, 2.29 GiB; tsrs 6.37 s, 0.88 GiB); --checkers 2: 3.4x faster, 2.5x less memory (tsgo 13.30 s, 2.60 GiB; tsrs 3.96 s, 1.02 GiB); --checkers 4: 3.5x faster, 2.7x less memory (tsgo 8.46 s, 3.12 GiB; tsrs 2.41 s, 1.15 GiB); --checkers 8: 4.3x faster, 3.0x less memory (tsgo 6.82 s, 4.06 GiB; tsrs 1.60 s, 1.35 GiB). playwright: --checkers 1: 2.7x faster, 2.2x less memory (tsgo 1.57 s, 0.55 GiB; tsrs 0.57 s, 0.25 GiB); --checkers 2: 3.3x faster, 2.4x less memory (tsgo 1.13 s, 0.63 GiB; tsrs 0.34 s, 0.26 GiB); --checkers 4: 4.2x faster, 2.4x less memory (tsgo 0.98 s, 0.75 GiB; tsrs 0.24 s, 0.31 GiB); --checkers 8: 5.3x faster, 2.6x less memory (tsgo 0.87 s, 0.98 GiB; tsrs 0.16 s, 0.37 GiB). typeorm: --checkers 1: 2.7x faster, 2.0x less memory (tsgo 2.78 s, 0.40 GiB; tsrs 1.05 s, 0.20 GiB); --checkers 2: 2.8x faster, 2.0x less memory (tsgo 1.76 s, 0.42 GiB; tsrs 0.63 s, 0.21 GiB); --checkers 4: 3.0x faster, 2.1x less memory (tsgo 1.21 s, 0.45 GiB; tsrs 0.40 s, 0.22 GiB); --checkers 8: 3.5x faster, 2.2x less memory (tsgo 0.97 s, 0.51 GiB; tsrs 0.28 s, 0.23 GiB). date-fns: --checkers 1: 3.0x faster, 1.8x less memory (tsgo 0.34 s, 0.25 GiB; tsrs 0.11 s, 0.14 GiB); --checkers 2: 2.9x faster, 1.8x less memory (tsgo 0.30 s, 0.25 GiB; tsrs 0.10 s, 0.14 GiB); --checkers 4: 3.1x faster, 1.8x less memory (tsgo 0.33 s, 0.26 GiB; tsrs 0.11 s, 0.14 GiB); --checkers 8: 3.1x faster, 1.8x less memory (tsgo 0.32 s, 0.25 GiB; tsrs 0.10 s, 0.14 GiB). Median of 10 interleaved runs (3 for tsgo). tsrs uses PGO-optimized dist build, built like the npm release binaries. Machine: Namespace nscloud-ubuntu-24.04-amd64-8x16 (8 vCPU, 16 GB RAM, Linux x86_64, AMD EPYC). Measured 2026-10-19 04:48 UTC; tsrs commit 732835cc50b86909a74f7747ba07ace0624aa3fd. TypeScript 7.1.0-dev.20261018.1; TypeScript reference b85298b6a81f772d080b0455de0ca9d744cd6fd6.</desc>
