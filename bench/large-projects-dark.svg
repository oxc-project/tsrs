<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-labelledby="title description">
  <title id="title">tsrs vs TypeScript 7.1 beta</title>
  <desc id="description">How many times faster default tsrs type-checks than TypeScript 7.1 beta, against how many times less peak memory it uses, both compilers with default settings on an Apple M4 Pro (12 cores). Both axes start at 1x, parity with TypeScript; the speed axis is logarithmic. Up and to the right is better. vscode: 1.7x faster, 2.3x less memory (TypeScript 4.99 s, 5.51 GiB; tsrs 2.89 s, 2.35 GiB). mui-docs: 1.6x faster, 2.5x less memory (TypeScript 4.80 s, 3.24 GiB; tsrs 3.04 s, 1.29 GiB). t3code-server: 3.8x faster, 2.3x less memory (TypeScript 6.47 s, 4.17 GiB; tsrs 1.70 s, 1.82 GiB). supabase: 1.5x faster, 2.4x less memory (TypeScript 4.40 s, 3.25 GiB; tsrs 2.88 s, 1.38 GiB). playwright: 2.5x faster, 2.1x less memory (TypeScript 0.55 s, 0.74 GiB; tsrs 0.22 s, 0.35 GiB). typeorm: 1.4x faster, 2.0x less memory (TypeScript 0.65 s, 0.46 GiB; tsrs 0.48 s, 0.23 GiB). date-fns: 1.3x faster, 1.9x less memory (TypeScript 0.26 s, 0.26 GiB; tsrs 0.21 s, 0.14 GiB). Median of 10 interleaved runs (5 for TypeScript). TypeScript: typescript@7.1.0-beta. tsrs: tsrs@0.20.0-ts7.1.0-beta, npm release binary, default mode. Measured 2026-10-26. Machine: Apple M4 Pro, 12 cores, 48 GB.</desc>
  <metadata>Generated by bench/release.mjs; modes: default; typescript@7.1.0-beta; tsrs@0.20.0-ts7.1.0-beta; measured: 2026-10-26 15:28 UTC. Details: https://github.com/oxc-project/tsrs/blob/main/bench/RESULTS.md</metadata>
