<desc id="description">Compiler-Unions: tsrs 4.95 times faster and 1.85 times less peak memory than TypeScript 7.1.0-dev.20261022.1. Compiler: tsrs 2.28 times faster and 1.72 times less peak memory than TypeScript 7.1.0-dev.20261022.1. cal-diy: tsrs 2.65 times faster and 2.64 times less peak memory than TypeScript 7.1.0-dev.20261022.1. date-fns: tsrs 2.81 times faster and 1.73 times less peak memory than TypeScript 7.1.0-dev.20261022.1. drizzle-orm: tsrs 5.19 times faster and 2.66 times less peak memory than TypeScript 7.1.0-dev.20261022.1. formbricks-web: tsrs 3.90 times faster and 3.01 times less peak memory than TypeScript 7.1.0-dev.20261022.1. mikro-orm: tsrs 4.76 times faster and 2.81 times less peak memory than TypeScript 7.1.0-dev.20261022.1. mui-docs: tsrs 4.45 times faster and 3.27 times less peak memory than TypeScript 7.1.0-dev.20261022.1. next-packages-next: tsrs 5.26 times faster and 2.46 times less peak memory than TypeScript 7.1.0-dev.20261022.1. next-root: tsrs 3.68 times faster and 2.57 times less peak memory than TypeScript 7.1.0-dev.20261022.1. nuxt: tsrs 3.55 times faster and 2.61 times less peak memory than TypeScript 7.1.0-dev.20261022.1. playwright: tsrs 3.79 times faster and 2.47 times less peak memory than TypeScript 7.1.0-dev.20261022.1. storybook: tsrs 2.92 times faster and 2.61 times less peak memory than TypeScript 7.1.0-dev.20261022.1. supabase-studio: tsrs 4.30 times faster and 2.73 times less peak memory than TypeScript 7.1.0-dev.20261022.1. t3code-server: tsrs 5.29 times faster and 3.85 times less peak memory than TypeScript 7.1.0-dev.20261022.1. typeorm: tsrs 3.10 times faster and 2.09 times less peak memory than TypeScript 7.1.0-dev.20261022.1. vscode: tsrs 3.38 times faster and 3.06 times less peak memory than TypeScript 7.1.0-dev.20261022.1. webpack: tsrs 2.89 times faster and 2.28 times less peak memory than TypeScript 7.1.0-dev.20261022.1. xstate-main: tsrs 4.69 times faster and 2.48 times less peak memory than TypeScript 7.1.0