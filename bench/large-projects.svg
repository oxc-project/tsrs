<desc id="description">Compiler-Unions: tsrs 3.10 times faster and 1.86 times less peak memory than TypeScript 7.1.0-dev.20261022.1. Compiler: tsrs 2.62 times faster and 1.75 times less peak memory than TypeScript 7.1.0-dev.20261022.1. cal-diy: tsrs 2.21 times faster and 2.60 times less peak memory than TypeScript 7.1.0-dev.20261022.1. date-fns: tsrs 2.91 times faster and 1.73 times less peak memory than TypeScript 7.1.0-dev.20261022.1. drizzle-orm: tsrs 3.80 times faster and 1.84 times less peak memory than TypeScript 7.1.0-dev.20261022.1. formbricks-web: tsrs 3.33 times faster and 3.04 times less peak memory than TypeScript 7.1.0-dev.20261022.1. mikro-orm: tsrs 2.85 times faster and 3.01 times less peak memory than TypeScript 7.1.0-dev.20261022.1. mui-docs: tsrs 5.24 times faster and 3.27 times less peak memory than TypeScript 7.1.0-dev.20261022.1. next-packages-next: tsrs 3.68 times faster and 2.49 times less peak memory than TypeScript 7.1.0-dev.20261022.1. next-root: tsrs 3.61 times faster and 2.50 times less peak memory than TypeScript 7.1.0-dev.20261022.1. nuxt: tsrs 3.82 times faster and 2.57 times less peak memory than TypeScript 7.1.0-dev.20261022.1. playwright: tsrs 3.58 times faster and 2.46 times less peak memory than TypeScript 7.1.0-dev.20261022.1. storybook: tsrs 5.05 times faster and 2.54 times less peak memory than TypeScript 7.1.0-dev.20261022.1. supabase-studio: tsrs 3.20 times faster and 2.70 times less peak memory than TypeScript 7.1.0-dev.20261022.1. t3code-server: tsrs 5.61 times faster and 3.82 times less peak memory than TypeScript 7.1.0-dev.20261022.1. typeorm: tsrs 2.13 times faster and 2.08 times less peak memory than TypeScript 7.1.0-dev.20261022.1. vscode: tsrs 4.09 times faster and 3.09 times less peak memory than TypeScript 7.1.0-dev.20261022.1. webpack: tsrs 3.27 times faster and 2.31 times less peak memory than TypeScript 7.1.0-dev.20261022.1. xstate-main: tsrs 3.80 times faster and 2.47 times less peak memory than TypeScript 7.1.0