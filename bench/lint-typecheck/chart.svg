<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="559" viewBox="0 0 1200 559" role="img" aria-labelledby="title description">
  <title id="title">Type-aware lint and type check: one run or two</title>
  <desc id="description">Outline's 7 type-aware rules and a full type check; 8 cores of an AWS m8g.4xlarge; median of 5 runs (ESLint 2). VS Code: Wall time: Oxlint + tsrs, one run 4.9 s; Oxlint + tsrs, separate check 6.1 s, 1.23x; Oxlint + tsgolint, tsgo 22.2 s, 4.49x; ESLint + typescript-eslint, tsc 289 s, 58x. CPU time, all processes: Oxlint + tsrs, one run 24.6 s; Oxlint + tsrs, separate check 36.5 s, 1.48x; Oxlint + tsgolint, tsgo 146 s, 5.91x; ESLint + typescript-eslint, tsc 628 s, 25x. Peak memory, all processes: Oxlint + tsrs, one run 3.6 GiB; Oxlint + tsrs, separate check 4.9 GiB, 1.34x; Oxlint + tsgolint, tsgo 16.0 GiB, 4.42x; ESLint + typescript-eslint, tsc 28.9 GiB, 7.97x. Outline: Wall time: Oxlint + tsrs, one run 2.3 s; Oxlint + tsrs, separate check 2.5 s, 1.05x; Oxlint + tsgolint, tsgo 9.7 s, 4.12x; ESLint + typescript-eslint, tsc 54.3 s, 23x. CPU time, all processes: Oxlint + tsrs, one run 8.9 s; Oxlint + tsrs, separate check 13.8 s, 1.55x; Oxlint + tsgolint, tsgo 50.3 s, 5.64x; ESLint + typescript-eslint, tsc 127 s, 14x. Peak memory, all processes: Oxlint + tsrs, one run 1.2 GiB; Oxlint + tsrs, separate check 1.8 GiB, 1.51x; Oxlint + tsgolint, tsgo 4.8 GiB, 4.17x; ESLint + typescript-eslint, tsc 8.2 GiB, 7.09x. Vue core: Wall time: Oxlint + tsrs, one run 0.38 s; Oxlint + tsrs, separate check 0.36 s, 0.97x; Oxlint + tsgolint, tsgo 1.4 s, 3.76x; ESLint + typescript-eslint, tsc 12.4 s, 33x. CPU time, all processes: Oxlint + tsrs, one run 1.5 s; Oxlint + tsrs, separate check 2.1 s, 1.40x; Oxlint + tsgolint, tsgo 8.2 s, 5.33x; ESLint + typescript-eslint, tsc 37.7 s, 25x. Peak memory, all processes: Oxlint + tsrs, one run 405 MiB; Oxlint + tsrs, separate check 508 MiB, 1.25x; Oxlint + tsgolint, tsgo 1.1 GiB, 2.79x; ESLint + typescript-eslint, tsc 2.7 GiB, 6.86x. Shorter bars are better.</desc>
