[package]
name = "tsrs_core"
version = "7.1.0-beta.tsrs1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src", "/build.rs", "/LICENSE", "/NOTICE"]
description = "Core types and utilities for the tsrs TypeScript compiler"

[lints]
workspace = true

[features]
# Atomic borrow checking for FrozenCell in release builds (always on with debug_assertions).
checked-cells = []
# Opt out of Unix pointer compression (build.rs; for comparisons: `--features tsrs_core/plain-ptrs`).
plain-ptrs = []
# The shared type graph (src/sharedgraph.rs, on with TSRS_SHARED_GRAPH=1). Without it every frozen-object test is a
# constant false and its read and write paths fold away.
shared-graph = []
# The mimalloc global allocator for the binaries (allocator::MiMalloc).
mimalloc = ["dep:libmimalloc-sys2"]

[dependencies]
rustc-hash.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
memchr.workspace = true
unicode-id-start.workspace = true
icu_normalizer.workspace = true
simdutf8.workspace = true
dragonbox_ecma.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
libmimalloc-sys2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
unicode-normalization.workspace = true

[lib]
test = false
doctest = false
