[package]
name = "tsrs_parser"
version = "0.25.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src", "/build.rs", "/LICENSE", "/NOTICE"]
description = "TypeScript and JavaScript parser for tsrs"

[lints]
workspace = true

[dependencies]
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
tsrs_ast.workspace = true
tsrs_scanner.workspace = true
rustc-hash.workspace = true
bitflags.workspace = true

[dev-dependencies]
tsrs_vfs.workspace = true
tsrs_core = { workspace = true, features = ["mimalloc"] }

[lib]
test = false
doctest = false
