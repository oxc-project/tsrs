[package]
name = "tsrs_vfs"
version = "7.1.0-beta.tsrs0001"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src", "/build.rs", "/LICENSE", "/NOTICE", "/libs"]
description = "Virtual filesystem and bundled TypeScript libraries for tsrs"

[lints]
workspace = true

[features]
# Read standard libraries beside the executable, as in upstream npm builds.
noembed = []

[dependencies]
tsrs_core.workspace = true
rustc-hash.workspace = true
rayon.workspace = true
bitflags.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[lib]
test = false
doctest = false
