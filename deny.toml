# cargo deny check (https://embarkstudios.github.io/cargo-deny/): advisories, licenses, bans, sources.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSL-1.0", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# The only version-less dependencies are the workspace path crates (not published to crates.io).
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary source for the published criterion2 3.0.5 release while its registry index entry is missing.
allow-git = ["https://github.com/Boshen/criterion2.rs"]
required-git-spec = "rev"
