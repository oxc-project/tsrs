[package]
name = "tsrs_napi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
napi = { version = "3.14.2", features = ["napi8", "serde-json"] }
napi-derive = "3.6.12"
serde_json = "1"
tsrs_api.workspace = true
tsrs_ast.workspace = true
tsrs_compiler.workspace = true
tsrs_core = { workspace = true, features = ["plain-ptrs"] }
tsrs_execute = { path = "../crates/tsrs_execute" }
tsrs_vfs.workspace = true
tsrs_contentmapper.workspace = true

[build-dependencies]
napi-build = "2"
