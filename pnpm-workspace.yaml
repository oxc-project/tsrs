packages:
  - npm
  - playground
# Keep plugins and tests on the Vite+ toolchain's bundled versions.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5
peerDependencyRules:
  allowedVersions:
    # Vite+ uses its own version number for its Vite 8-compatible core.
    vite: 1.3.0
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  workerd: true
# These two native packages for the pinned TypeScript 7.1 beta are newer than pnpm's minimum release age.
minimumReleaseAgeExclude:
  - '@typescript/typescript-aix-ppc64@7.1.0-beta'
  - '@typescript/typescript-linux-arm64@7.1.0-beta'
  # Explicitly requested dependency updates newer than pnpm's minimum release age.
  - '@void/deploy-cloudflare@1.2.1'
  - '@void/deploy-core@1.2.1'
  - '@void/edge@1.2.1'
  - '@void/isr@1.2.1'
  - '@void/platform@1.2.1'
  - sass@1.106.1
  - void@1.2.1
